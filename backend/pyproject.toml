[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-pde-bench"
version = "0.1.0"
description = "Physics-Informed and Operator-Learning Framework for Forward/Inverse PDEs with Uncertainty Quantification"
authors = [{name = "AGY SciML Team"}]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
